basePath: /api/v1
definitions:
  internal_api.CreateWebhookRequest:
    properties:
      enabled:
        type: boolean
      group_ids:
        items:
          type: integer
        type: array
      secret:
        type: string
      url:
        type: string
    type: object
  internal_api.UnsubscribeRequest:
    properties:
      entity_id:
        type: integer
      entity_type:
        type: string
      fcm_token:
        type: string
    type: object
  internal_api.notificationSettingsPatch:
    properties:
      before_minutes:
        type: integer
      digest_time:
        type: string
      entity_id:
        type: integer
      entity_type:
        type: string
      fcm_token:
        type: string
      notify_before_lesson:
        type: boolean
      notify_daily_digest:
        type: boolean
      notify_on_change:
        type: boolean
      subgroup:
        type: string
      timezone:
        type: string
    type: object
  internal_api.subscribeRequest:
    description: Creates or updates a notification subscription for a group, tutor,
      or auditory.
    properties:
      before_minutes:
        type: integer
      digest_time:
        type: string
      entity_id:
        type: integer
      entity_type:
        type: string
      fcm_token:
        type: string
      notify_before_lesson:
        type: boolean
      notify_daily_digest:
        type: boolean
      notify_on_change:
        type: boolean
      subgroup:
        type: string
      timezone:
        type: string
    type: object
  omsu_mirror_internal_diff.Change:
    properties:
      field:
        type: string
      label:
        type: string
      new:
        type: string
      old:
        type: string
    type: object
  omsu_mirror_internal_models.Auditory:
    properties:
      building:
        type: string
      id:
        type: integer
      name:
        type: string
    type: object
  omsu_mirror_internal_models.BFFResponse:
    properties:
      cached_at:
        type: string
      data: {}
      has_next:
        type: boolean
      has_prev:
        type: boolean
      source:
        description: '"cache", "upstream", "stale"'
        type: string
      success:
        type: boolean
      week_end:
        type: string
      week_start:
        type: string
    type: object
  omsu_mirror_internal_models.Day:
    properties:
      date:
        type: string
      day:
        type: string
      lessons:
        items:
          $ref: '#/definitions/omsu_mirror_internal_models.Lesson'
        type: array
    type: object
  omsu_mirror_internal_models.Group:
    properties:
      id:
        type: integer
      name:
        type: string
      real_group_id:
        type: integer
    type: object
  omsu_mirror_internal_models.Lesson:
    properties:
      auditCorps:
        type: string
      building:
        type: string
      faculty:
        type: string
      group:
        type: string
      id:
        type: integer
      lesson:
        type: string
      publishDate:
        type: string
      room:
        type: string
      subgroup_number:
        type: string
      subgroupName:
        type: string
      teacher:
        type: string
      time:
        type: integer
      type_work:
        type: string
    type: object
  omsu_mirror_internal_models.Tutor:
    properties:
      id:
        type: integer
      name:
        type: string
    type: object
  omsu_mirror_internal_storage.ScheduleChange:
    properties:
      change_type:
        description: '"added", "removed", "modified"'
        type: string
      changes:
        description: normalized field changes
        items:
          $ref: '#/definitions/omsu_mirror_internal_diff.Change'
        type: array
      created_at:
        type: string
      day:
        description: ISO date of the lesson
        type: string
      entity_id:
        type: integer
      entity_type:
        type: string
      id:
        type: integer
      lesson_id:
        type: integer
      new_data:
        description: raw Lesson JSON
        type: string
      old_data:
        description: raw Lesson JSON
        type: string
      pair:
        description: lesson time slot
        type: integer
      subgroup:
        description: normalized subgroup number
        type: string
      subject:
        description: readable lesson name
        type: string
    type: object
  omsu_mirror_internal_storage.Subscription:
    properties:
      before_minutes:
        type: integer
      digest_time:
        type: string
      entity_id:
        type: integer
      entity_type:
        type: string
      fcm_token:
        type: string
      last_digest_at:
        type: string
      last_reminder_at:
        type: string
      notify_before_lesson:
        type: boolean
      notify_daily_digest:
        type: boolean
      notify_on_change:
        type: boolean
      subgroup:
        type: string
      timezone:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: High-performance BFF for Omsu university schedule.
  title: Omsu Schedule Mirror API
  version: "1.0"
paths:
  /admin/webhooks:
    get:
      description: Get all registered webhook subscribers
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: List webhook subscribers
      tags:
      - Admin
    post:
      consumes:
      - application/json
      description: Register a new webhook subscriber or update existing by URL (idempotent)
      parameters:
      - description: Webhook subscriber data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_api.CreateWebhookRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "422":
          description: Unprocessable Entity
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Create or update webhook subscriber
      tags:
      - Admin
  /admin/webhooks/{id}:
    delete:
      description: Remove a webhook subscriber by ID
      parameters:
      - description: Webhook subscriber ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Delete webhook subscriber
      tags:
      - Admin
    patch:
      consumes:
      - application/json
      description: Update an existing webhook subscriber by ID
      parameters:
      - description: Webhook subscriber ID
        in: path
        name: id
        required: true
        type: integer
      - description: Webhook fields to update
        in: body
        name: body
        schema:
          $ref: '#/definitions/internal_api.CreateWebhookRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Update webhook subscriber
      tags:
      - Admin
  /admin/webhooks/by-url:
    put:
      consumes:
      - application/json
      description: Create or update a webhook subscriber by URL (idempotent)
      parameters:
      - description: Webhook subscriber data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_api.CreateWebhookRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "422":
          description: Unprocessable Entity
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Upsert webhook subscriber by URL
      tags:
      - Admin
  /admin/webhooks/failed:
    get:
      description: Get all failed webhook deliveries (dead-letter queue)
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: List failed webhook deliveries
      tags:
      - Admin
  /auditories:
    get:
      description: Returns a list of all auditories and buildings.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/omsu_mirror_internal_models.BFFResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/omsu_mirror_internal_models.Auditory'
                  type: array
              type: object
      summary: Get all auditories
      tags:
      - Dictionaries
  /auditories/{id}:
    get:
      description: Returns a single auditory by its ID.
      parameters:
      - description: Auditory ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/omsu_mirror_internal_models.BFFResponse'
            - properties:
                data:
                  $ref: '#/definitions/omsu_mirror_internal_models.Auditory'
              type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get auditory by ID
      tags:
      - Dictionaries
  /changes:
    get:
      description: Returns a filterable, paginated feed of schedule changes. Omit
        entity filters for all entities.
      parameters:
      - description: group, tutor, auditory
        in: query
        name: entity_type
        type: string
      - description: Entity ID
        in: query
        name: entity_id
        type: integer
      - description: Subgroup number (1, 2)
        in: query
        name: subgroup
        type: string
      - description: 1..100, default 20
        in: query
        name: limit
        type: integer
      - description: Cursor for pagination (last received id)
        in: query
        name: before_id
        type: integer
      - description: RFC3339 or YYYY-MM-DD lower bound by created_at
        in: query
        name: since
        type: string
      - description: all — ignore entity filters
        in: query
        name: scope
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/omsu_mirror_internal_models.BFFResponse'
      summary: Get schedule changes feed
      tags:
      - Changes
  /changes/{type}/{id}:
    get:
      description: Returns recent schedule changes for a group, tutor, or auditory.
      parameters:
      - description: 'Entity type: group, tutor, auditory'
        in: path
        name: type
        required: true
        type: string
      - description: Entity ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/omsu_mirror_internal_models.BFFResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/omsu_mirror_internal_storage.ScheduleChange'
                  type: array
              type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get schedule changes
      tags:
      - Changes
  /groups:
    get:
      description: Returns a list of all study groups.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/omsu_mirror_internal_models.BFFResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/omsu_mirror_internal_models.Group'
                  type: array
              type: object
      summary: Get all groups
      tags:
      - Dictionaries
  /groups/{id}:
    get:
      description: Returns a single group by its ID.
      parameters:
      - description: Group ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/omsu_mirror_internal_models.BFFResponse'
            - properties:
                data:
                  $ref: '#/definitions/omsu_mirror_internal_models.Group'
              type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get group by ID
      tags:
      - Dictionaries
  /health:
    get:
      description: Returns service uptime and cache statistics.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/omsu_mirror_internal_models.BFFResponse'
      summary: Get health status
      tags:
      - Meta
  /incidents:
    get:
      description: Returns recent health incidents for the upstream service.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/omsu_mirror_internal_models.BFFResponse'
      summary: Get recent incidents
      tags:
      - Meta
  /notifications/settings:
    patch:
      consumes:
      - application/json
      description: Partially updates subscription preferences for an entity. Omitted
        fields keep their values.
      parameters:
      - description: Notification settings patch
        in: body
        name: settings
        required: true
        schema:
          $ref: '#/definitions/internal_api.notificationSettingsPatch'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Update notification settings
      tags:
      - Notifications
  /notifications/settings/{type}/{id}:
    get:
      description: Returns current notification preferences for a specific subscription.
      parameters:
      - description: Entity type (group, tutor, auditory)
        in: path
        name: type
        required: true
        type: string
      - description: Entity ID
        in: path
        name: id
        required: true
        type: integer
      - description: FCM Token
        in: header
        name: X-FCM-Token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/omsu_mirror_internal_storage.Subscription'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get notification settings
      tags:
      - Notifications
  /schedule/{type}/{id}/day:
    get:
      description: Returns the schedule for a specific day. Loads the whole week from
        cache if needed.
      parameters:
      - description: 'Entity type: group, tutor, auditory'
        in: path
        name: type
        required: true
        type: string
      - description: Entity ID
        in: path
        name: id
        required: true
        type: integer
      - description: Target date in YYYY-MM-DD format
        in: query
        name: date
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/omsu_mirror_internal_models.BFFResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/omsu_mirror_internal_models.Day'
                  type: array
              type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get single day schedule
      tags:
      - Schedules
  /schedule/auditory/{id}:
    get:
      description: Returns the schedule for a specific auditory. Lazy-fetches if not
        in cache.
      parameters:
      - description: Auditory ID
        in: path
        name: id
        required: true
        type: integer
      - description: Week start date in YYYY-MM-DD format
        in: query
        name: week_start
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/omsu_mirror_internal_models.BFFResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/omsu_mirror_internal_models.Day'
                  type: array
              type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get auditory schedule
      tags:
      - Schedules
  /schedule/auditory/{id}/ical:
    get:
      description: Returns the schedule for an auditory in .ics format. If ICAL_ACCESS_TOKEN
        is configured, pass it as the token query parameter.
      parameters:
      - description: Auditory ID
        in: path
        name: id
        required: true
        type: integer
      - description: Optional iCal access token
        in: query
        name: token
        type: string
      produces:
      - text/calendar
      responses:
        "200":
          description: iCalendar payload
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Export auditory schedule as iCalendar
      tags:
      - Schedules
  /schedule/group/{id}:
    get:
      description: Returns the schedule for a specific group. Lazy-fetches if not
        in cache.
      parameters:
      - description: Group ID (real_group_id)
        in: path
        name: id
        required: true
        type: integer
      - description: Week start date in YYYY-MM-DD format
        in: query
        name: week_start
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/omsu_mirror_internal_models.BFFResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/omsu_mirror_internal_models.Day'
                  type: array
              type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get group schedule
      tags:
      - Schedules
  /schedule/group/{id}/ical:
    get:
      description: Returns the schedule for a group in .ics format. If ICAL_ACCESS_TOKEN
        is configured, pass it as the token query parameter.
      parameters:
      - description: Group ID (real_group_id)
        in: path
        name: id
        required: true
        type: integer
      - description: Optional iCal access token
        in: query
        name: token
        type: string
      produces:
      - text/calendar
      responses:
        "200":
          description: iCalendar payload
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Export group schedule as iCalendar
      tags:
      - Schedules
  /schedule/tutor/{id}:
    get:
      description: Returns the schedule for a specific tutor. Lazy-fetches if not
        in cache.
      parameters:
      - description: Tutor ID
        in: path
        name: id
        required: true
        type: integer
      - description: Week start date in YYYY-MM-DD format
        in: query
        name: week_start
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/omsu_mirror_internal_models.BFFResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/omsu_mirror_internal_models.Day'
                  type: array
              type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get tutor schedule
      tags:
      - Schedules
  /schedule/tutor/{id}/ical:
    get:
      description: Returns the schedule for a tutor in .ics format. If ICAL_ACCESS_TOKEN
        is configured, pass it as the token query parameter.
      parameters:
      - description: Tutor ID
        in: path
        name: id
        required: true
        type: integer
      - description: Optional iCal access token
        in: query
        name: token
        type: string
      produces:
      - text/calendar
      responses:
        "200":
          description: iCalendar payload
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Export tutor schedule as iCalendar
      tags:
      - Schedules
  /search:
    get:
      description: Prefix search with autocomplete.
      parameters:
      - description: Query string (min 2 chars)
        in: query
        name: q
        required: true
        type: string
      - default: all
        description: 'Filter type: group, tutor, auditory, all'
        in: query
        name: type
        type: string
      - default: 20
        description: Limit results
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/omsu_mirror_internal_models.BFFResponse'
      summary: Search groups, tutors, or auditories
      tags:
      - Search
  /subscribe:
    post:
      parameters:
      - description: Subscription
        in: body
        name: subscription
        required: true
        schema:
          $ref: '#/definitions/internal_api.subscribeRequest'
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: boolean
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "422":
          description: Unprocessable Entity
          schema:
            additionalProperties:
              type: string
            type: object
        "429":
          description: Too Many Requests
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
  /subscriptions:
    get:
      description: Returns all subscriptions belonging to the FCM token from X-FCM-Token.
      parameters:
      - description: FCM Token
        in: header
        name: X-FCM-Token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/omsu_mirror_internal_models.BFFResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List subscriptions for a device
      tags:
      - Notifications
  /sync/status:
    get:
      description: Returns the last synchronization timestamps for dictionaries and
        schedules.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/omsu_mirror_internal_models.BFFResponse'
      summary: Get sync status
      tags:
      - Meta
  /sync/trigger:
    post:
      description: Forces a background synchronization of dictionaries and active
        schedules. (Admin only)
      parameters:
      - description: Admin Secret Key
        in: header
        name: X-Admin-Key
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/omsu_mirror_internal_models.BFFResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Trigger manual sync
      tags:
      - Meta
  /tutors:
    get:
      description: Returns a list of all teachers.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/omsu_mirror_internal_models.BFFResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/omsu_mirror_internal_models.Tutor'
                  type: array
              type: object
      summary: Get all tutors
      tags:
      - Dictionaries
  /tutors/{id}:
    get:
      description: Returns a single teacher by their ID.
      parameters:
      - description: Tutor ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/omsu_mirror_internal_models.BFFResponse'
            - properties:
                data:
                  $ref: '#/definitions/omsu_mirror_internal_models.Tutor'
              type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get tutor by ID
      tags:
      - Dictionaries
  /unsubscribe:
    post:
      consumes:
      - application/json
      description: Removes a notification subscription for a group, tutor, or auditory.
      parameters:
      - description: Subscription identity
        in: body
        name: subscription
        required: true
        schema:
          $ref: '#/definitions/internal_api.UnsubscribeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: boolean
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "422":
          description: Unprocessable Entity
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Unsubscribe from schedule notifications
      tags:
      - Notifications
securityDefinitions:
  ApiKeyAuth:
    in: header
    name: X-Admin-Key
