# Manual build & run for testing (e.g. on a VDS before CI/CD is set up).
#
# Quick start:
#   cp .env.example .env      # then set ADMIN_KEY and CORS_ALLOWED_ORIGINS
#   docker compose up --build
#
# Only the backend is started (HTTP on 8080). The frontend is intentionally
# omitted here — for the full stack use docker-compose.local.yml.
#
# APP_ENV=production is forced below: the app refuses to start without
# ADMIN_KEY / CORS_ALLOWED_ORIGINS, so admin endpoints are never left open.
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: omsu_mirror_backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
    env_file:
      - path: .env
        required: false
    environment:
      - APP_ENV=production
      - SQLITE_PATH=/app/data/mirror.db
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/ready"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
