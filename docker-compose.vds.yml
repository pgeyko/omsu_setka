# Deployment for the VDS origin server (behind Russian CDN).
#
# The host system nginx terminates TLS for t1.r.pgeyko.ru and routes:
#   /api/stream  -> Xray VLESS+XHTTP (127.0.0.1:8080)
#   everything   -> this frontend (127.0.0.1:8081)
#
# The backend is NOT exposed to the host network; the frontend container
# proxies /api to it over the internal "setka" network.
#
# Build locally with full .env (Firebase keys required for the frontend build):
#   docker compose -f docker-compose.vds.yml build
# Then on the server:
#   docker compose -f docker-compose.vds.yml up -d
services:
  backend:
    image: ghcr.io/pgeyko/omsu_setka/backend:${BACKEND_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: omsu_setka_backend
    restart: always
    volumes:
      - backend_data:/app/data
    env_file:
      - .env
    environment:
      - APP_ENV=production
      - SERVER_PORT=8080
      - SQLITE_PATH=/app/data/mirror.db
      - GOMEMLIMIT=192MiB
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    networks:
      - setka
    healthcheck:
      test: ["CMD", "curl", "-s", "-o", "/dev/null", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    image: ghcr.io/pgeyko/omsu_setka/frontend:${FRONTEND_TAG:-latest}
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        - VITE_API_BASE=${VITE_API_BASE:-https://s.pgeyko.ru/api/v1}
        - VITE_API_ORIGIN=${VITE_API_ORIGIN:-https://t1.r.pgeyko.ru/api/v1}
        - VITE_CF_ANALYTICS_TOKEN=${VITE_CF_ANALYTICS_TOKEN:-}
        - VITE_FIREBASE_API_KEY=${VITE_FIREBASE_API_KEY:-}
        - VITE_FIREBASE_AUTH_DOMAIN=${VITE_FIREBASE_AUTH_DOMAIN:-}
        - VITE_FIREBASE_PROJECT_ID=${VITE_FIREBASE_PROJECT_ID:-}
        - VITE_FIREBASE_STORAGE_BUCKET=${VITE_FIREBASE_STORAGE_BUCKET:-}
        - VITE_FIREBASE_MESSAGING_SENDER_ID=${VITE_FIREBASE_MESSAGING_SENDER_ID:-}
        - VITE_FIREBASE_APP_ID=${VITE_FIREBASE_APP_ID:-}
        - VITE_FIREBASE_MEASUREMENT_ID=${VITE_FIREBASE_MEASUREMENT_ID:-}
        - VITE_FIREBASE_VAPID_KEY=${VITE_FIREBASE_VAPID_KEY:-}
    container_name: omsu_setka_frontend
    restart: always
    depends_on:
      - backend
    networks:
      - setka
    ports:
      - "127.0.0.1:8081:80"

networks:
  setka:
    driver: bridge

volumes:
  backend_data:
