name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
    inputs:
      backend_tag:
        description: 'Backend image tag to deploy (default: current commit SHA)'
        required: false
        default: ''
      frontend_tag:
        description: 'Frontend image tag to deploy (default: current commit SHA)'
        required: false
        default: ''

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/pgeyko/omsu_setka/backend
  FRONTEND_IMAGE: ghcr.io/pgeyko/omsu_setka/frontend

jobs:
  backend-test:
    name: Backend Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - name: Secret scanning
        uses: gitleaks/gitleaks-action@v2
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: core/go.sum
      - run: go vet ./...
      - run: go test -race ./...

  frontend-test:
    name: Frontend Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npm run build
      - run: npm run test --if-present

  # The redesign lives in web-next until it replaces web/. After the merge this
  # job becomes a no-op because web-next/ no longer exists.
  frontend-next-test:
    name: Frontend (redesign) Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: hashFiles('web-next/package.json') != ''
        with:
          node-version: '20'
      - name: Unit tests, build and PWA check
        if: hashFiles('web-next/package.json') != ''
        run: |
          cd web-next
          npm ci --legacy-peer-deps
          npm test
          npm run build
          npm run test:build

  frontend-next-e2e:
    name: Frontend (redesign) E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: hashFiles('web-next/package.json') != ''
        with:
          node-version: '20'
      - name: Install dependencies
        if: hashFiles('web-next/package.json') != ''
        working-directory: web-next
        run: npm ci --legacy-peer-deps
      - name: Browser scenarios
        if: hashFiles('web-next/package.json') != ''
        working-directory: web-next
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: npm run test:e2e
      - name: Upload E2E artifacts
        if: failure() && hashFiles('web-next/e2e/artifacts/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: web-next/e2e/artifacts
          if-no-files-found: ignore

  build-and-push:
    name: Build & Push ${{ matrix.target }}
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test, frontend-next-test, frontend-next-e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        target: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - if: matrix.target == 'backend'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
      - if: matrix.target == 'frontend'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./web/Dockerfile
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          build-args: |
            VITE_API_BASE=${{ vars.VITE_API_BASE || 'https://s.pgeyko.ru/api/v1' }}
            VITE_API_ORIGIN=${{ vars.VITE_API_ORIGIN || 'https://s.pgeyko.ru/api/v1' }}
            VITE_FIREBASE_API_KEY=${{ secrets.FIREBASE_API_KEY || '' }}
            VITE_FIREBASE_AUTH_DOMAIN=${{ secrets.FIREBASE_AUTH_DOMAIN || '' }}
            VITE_FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID || '' }}
            VITE_FIREBASE_STORAGE_BUCKET=${{ secrets.FIREBASE_STORAGE_BUCKET || '' }}
            VITE_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.FIREBASE_MESSAGING_SENDER_ID || '' }}
            VITE_FIREBASE_APP_ID=${{ secrets.FIREBASE_APP_ID || '' }}
            VITE_FIREBASE_MEASUREMENT_ID=${{ secrets.FIREBASE_MEASUREMENT_ID || '' }}
            VITE_FIREBASE_VAPID_KEY=${{ secrets.FIREBASE_VAPID_KEY || '' }}

  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest
    needs: [build-and-push]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    env:
      BACKEND_TAG: ${{ inputs.backend_tag || github.sha }}
      FRONTEND_TAG: ${{ inputs.frontend_tag || github.sha }}
    steps:
      - name: Check deploy secrets
        run: |
          fail=0
          [ -n "${{ secrets.SERVER_HOST }}" ] || { echo "::error::SERVER_HOST is empty"; fail=1; }
          [ -n "${{ secrets.SERVER_PORT }}" ] || { echo "::error::SERVER_PORT is empty"; fail=1; }
          [ -n "${{ secrets.SERVER_USER }}" ] || { echo "::error::SERVER_USER is empty"; fail=1; }
          [ -n "${{ secrets.DEPLOY_PATH }}" ] || { echo "::error::DEPLOY_PATH is empty"; fail=1; }
          [ -n "${{ secrets.SSH_PRIVATE_KEY }}" ] || { echo "::error::SSH_PRIVATE_KEY is empty"; fail=1; }
          exit $fail
      - name: Deploy via SSH
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/setka_deploy
          chmod 600 ~/.ssh/setka_deploy
          # shellcheck disable=SC2029
          ssh -p "${{ secrets.SERVER_PORT }}" -o StrictHostKeyChecking=accept-new -i ~/.ssh/setka_deploy \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" \
            "BACKEND_TAG='$BACKEND_TAG' FRONTEND_TAG='$FRONTEND_TAG' DEPLOY_PATH='${{ secrets.DEPLOY_PATH }}' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$DEPLOY_PATH"
          git pull --ff-only
          COMPOSE="docker compose -f docker-compose.deploy.yml -p setka"
          BACKEND_CONTAINER=omsu_setka_backend
          FRONTEND_CONTAINER=omsu_setka_frontend

          # Fixed container names must not be occupied by an older compose
          # project (core, prod, etc.). Compose would refuse to start and the
          # old containers would keep running, so clear only those conflicts.
          remove_stale_container() {
            name="$1"
            if docker container inspect "$name" >/dev/null 2>&1; then
              project=$(docker inspect -f '{{ index .Config.Labels "com.docker.compose.project" }}' "$name" 2>/dev/null || true)
              if [ "$project" != "setka" ]; then
                echo "Removing stale container $name (compose project: ${project:-none})"
                docker rm -f "$name"
              fi
            fi
          }
          remove_stale_container "$BACKEND_CONTAINER"
          remove_stale_container "$FRONTEND_CONTAINER"
          # The frontend publishes 127.0.0.1:8081. If a container from an old
          # project still owns the port, compose cannot recreate the frontend.
          port_owner=$(docker ps --filter "publish=8081" --format '{{.Names}}' | head -n1 || true)
          if [ -n "$port_owner" ] && [ "$port_owner" != "$FRONTEND_CONTAINER" ]; then
            echo "Removing container $port_owner that occupies port 8081"
            docker rm -f "$port_owner"
          fi
          for legacy in omsu_mirror_backend omsu_mirror_frontend omsu_mirror_backend_dev omsu_mirror_frontend_dev; do
            if docker container inspect "$legacy" >/dev/null 2>&1; then
              echo "Removing legacy container $legacy"
              docker rm -f "$legacy"
            fi
          done

          # Backup currently running images for rollback (local tags only, never pushed).
          for target in backend frontend; do
            image="ghcr.io/pgeyko/omsu_setka/$target:latest"
            if docker image inspect "$image" >/dev/null 2>&1; then
              docker tag "$image" "ghcr.io/pgeyko/omsu_setka/$target:prev" || true
            fi
          done
          export BACKEND_TAG FRONTEND_TAG
          $COMPOSE pull
          $COMPOSE up -d --remove-orphans
          wait_backend() { # $1 = attempts
            for _ in $(seq 1 "$1"); do
              st=$(docker inspect --format '{{.State.Health.Status}}' "$BACKEND_CONTAINER" 2>/dev/null || echo missing)
              [ "$st" = "healthy" ] && return 0
              sleep 5
            done
            return 1
          }
          if wait_backend 36 && [ "$(docker inspect --format '{{.State.Running}}' "$FRONTEND_CONTAINER" 2>/dev/null)" = "true" ]; then
            # Drop containers left from manual runs or renamed services that
            # still use the project images. Only the two fixed names remain.
            for cid in $(docker ps -aq); do
              name=$(docker inspect -f '{{.Name}}' "$cid" 2>/dev/null | sed 's#^/##')
              [ "$name" = "$BACKEND_CONTAINER" ] && continue
              [ "$name" = "$FRONTEND_CONTAINER" ] && continue
              image=$(docker inspect -f '{{.Config.Image}}' "$cid" 2>/dev/null || true)
              case "$image" in
                ghcr.io/pgeyko/omsu_setka/*)
                  echo "Removing stale container $name ($image)"
                  docker rm -f "$cid"
                  ;;
              esac
            done
            echo "Deploy healthy: backend=$BACKEND_TAG frontend=$FRONTEND_TAG"
            echo "Running containers:"
            docker ps --filter "name=omsu_setka_" --format '  {{.Names}}  {{.Status}}'
            exit 0
          fi
          echo "::error::Health gate failed, rolling back to previous images"
          if ! docker image inspect ghcr.io/pgeyko/omsu_setka/backend:prev >/dev/null 2>&1 || \
             ! docker image inspect ghcr.io/pgeyko/omsu_setka/frontend:prev >/dev/null 2>&1; then
            echo "::error::No previous images for rollback, manual intervention required"
            exit 1
          fi
          export BACKEND_TAG=prev FRONTEND_TAG=prev
          $COMPOSE up -d --remove-orphans
          wait_backend 24 && echo "Rollback healthy (previous images running)" || echo "::error::Rollback did not recover, manual intervention required"
          exit 1
          REMOTE
          echo "Deploy completed"
