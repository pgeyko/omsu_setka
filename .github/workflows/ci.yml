name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
    inputs:
      backend_tag:
        description: 'Backend image tag to deploy (default: current commit SHA)'
        required: false
        default: ''
      frontend_tag:
        description: 'Frontend image tag to deploy (default: current commit SHA)'
        required: false
        default: ''

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/pgeyko/omsu_setka/backend
  FRONTEND_IMAGE: ghcr.io/pgeyko/omsu_setka/frontend

jobs:
  backend-test:
    name: Backend Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - name: Secret scanning
        uses: gitleaks/gitleaks-action@v2
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: core/go.sum
      - run: go vet ./...
      - run: go test -race ./...

  frontend-test:
    name: Frontend Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npm run build

  build-and-push:
    name: Build & Push ${{ matrix.target }}
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        target: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - if: matrix.target == 'backend'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
      - if: matrix.target == 'frontend'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./web/Dockerfile
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          build-args: |
            VITE_API_BASE=${{ vars.VITE_API_BASE || 'https://s.pgeyko.ru/api/v1' }}
            VITE_API_ORIGIN=${{ vars.VITE_API_ORIGIN || 'https://t1.r.pgeyko.ru/api/v1' }}
            VITE_FIREBASE_API_KEY=${{ secrets.FIREBASE_API_KEY || '' }}
            VITE_FIREBASE_AUTH_DOMAIN=${{ secrets.FIREBASE_AUTH_DOMAIN || '' }}
            VITE_FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID || '' }}
            VITE_FIREBASE_STORAGE_BUCKET=${{ secrets.FIREBASE_STORAGE_BUCKET || '' }}
            VITE_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.FIREBASE_MESSAGING_SENDER_ID || '' }}
            VITE_FIREBASE_APP_ID=${{ secrets.FIREBASE_APP_ID || '' }}
            VITE_FIREBASE_MEASUREMENT_ID=${{ secrets.FIREBASE_MEASUREMENT_ID || '' }}
            VITE_FIREBASE_VAPID_KEY=${{ secrets.FIREBASE_VAPID_KEY || '' }}

  deploy:
    name: Deploy to VDS
    runs-on: ubuntu-latest
    needs: [build-and-push]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    env:
      BACKEND_TAG: ${{ inputs.backend_tag || github.sha }}
      FRONTEND_TAG: ${{ inputs.frontend_tag || github.sha }}
    steps:
      - name: Check deploy secrets
        run: |
          fail=0
          [ -n "${{ secrets.SERVER_HOST }}" ] || { echo "::error::SERVER_HOST is empty"; fail=1; }
          [ -n "${{ secrets.SERVER_PORT }}" ] || { echo "::error::SERVER_PORT is empty"; fail=1; }
          [ -n "${{ secrets.SERVER_USER }}" ] || { echo "::error::SERVER_USER is empty"; fail=1; }
          [ -n "${{ secrets.DEPLOY_PATH }}" ] || { echo "::error::DEPLOY_PATH is empty"; fail=1; }
          [ -n "${{ secrets.SSH_PRIVATE_KEY }}" ] || { echo "::error::SSH_PRIVATE_KEY is empty"; fail=1; }
          exit $fail
      - name: Deploy via SSH
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/setka_deploy
          chmod 600 ~/.ssh/setka_deploy
          # shellcheck disable=SC2029
          ssh -p "${{ secrets.SERVER_PORT }}" -o StrictHostKeyChecking=accept-new -i ~/.ssh/setka_deploy \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" \
            "BACKEND_TAG='$BACKEND_TAG' FRONTEND_TAG='$FRONTEND_TAG' DEPLOY_PATH='${{ secrets.DEPLOY_PATH }}' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$DEPLOY_PATH"
          git pull --ff-only
          COMPOSE="docker compose -f docker-compose.vds.yml -p setka"
          # Backup currently running images for rollback (local tags only, never pushed).
          docker tag ghcr.io/pgeyko/omsu_setka/backend:latest ghcr.io/pgeyko/omsu_setka/backend:prev
          docker tag ghcr.io/pgeyko/omsu_setka/frontend:latest ghcr.io/pgeyko/omsu_setka/frontend:prev
          export BACKEND_TAG FRONTEND_TAG
          $COMPOSE pull
          $COMPOSE up -d
          wait_backend() { # $1 = attempts
            for _ in $(seq 1 "$1"); do
              st=$(docker inspect --format '{{.State.Health.Status}}' omsu_setka_backend 2>/dev/null || echo missing)
              [ "$st" = "healthy" ] && return 0
              sleep 5
            done
            return 1
          }
          if wait_backend 36 && [ "$(docker inspect --format '{{.State.Running}}' omsu_setka_frontend 2>/dev/null)" = "true" ]; then
            echo "Deploy healthy: backend=$BACKEND_TAG frontend=$FRONTEND_TAG"
            exit 0
          fi
          echo "::error::Health gate failed, rolling back to previous images"
          export BACKEND_TAG=prev FRONTEND_TAG=prev
          $COMPOSE up -d
          wait_backend 24 && echo "Rollback healthy (previous images running)" || echo "::error::Rollback did not recover, manual intervention required"
          exit 1
          REMOTE
          echo "Deploy completed"
