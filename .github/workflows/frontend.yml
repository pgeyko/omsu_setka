name: Frontend

on:
  push:
    branches: [ main ]
    paths:
      - 'web/**'

jobs:
  lint:
    runs-on: ubuntu-latest
    container: node:24-alpine
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: npm ci
      - name: Run lint
        run: npm run lint

  build:
    runs-on: ubuntu-latest
    container: node:24-alpine
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
